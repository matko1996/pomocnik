<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0f172a">
<title>Pomocník</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Prvé ťuknutie odomkne zvuk, hlas a mikrofón (vyžaduje to prehliadač).
     Používateľ nečíta – na obrazovke sú len obrázky, všetko sa hovorí nahlas. -->
<div id="start" class="overlay start" aria-label="Ťukni kamkoľvek">
  <div class="huge">👆</div>
</div>

<main id="app">
  <button id="btn-settings" class="gear" aria-label="Nastavenia – podrž 2 sekundy">⚙️</button>

  <header id="subbar" class="subbar hidden">
    <button id="btn-back" class="back" aria-label="Späť">⬅️</button>
    <button class="mic mic-small" aria-label="Hovor">🎤</button>
  </header>

  <section id="screen-home" class="screen home">
    <button class="mic mic-big" aria-label="Hovor"><span class="mic-icon">🎤</span></button>
    <button id="btn-menu" class="menu-btn" aria-label="Výber obrázkom">
      <span class="mb-top">✝️</span>
      <span class="mb-bottom"><span>📻</span><span>🎵</span></span>
    </button>
  </section>

  <section id="screen-menu" class="screen menu hidden">
    <button class="tile t-bible" data-action="bible" aria-label="Biblia">✝️</button>
    <button class="tile t-radio" data-action="radio" aria-label="Rádio Lumen">📻</button>
    <button class="tile t-music" data-action="music" aria-label="Hudba">🎵</button>
  </section>

  <section id="screen-contacts" class="screen fill-grid hidden"></section>

  <div id="caption" class="caption hidden"></div>
</main>

<!-- Kým niečo hrá: len obrovské tlačidlo Stop, po ňom návrat na úvodnú obrazovku -->
<div id="playing" class="overlay playing hidden">
  <div id="playing-icon" class="playing-icon">🎵</div>
  <button id="playing-stop" class="playing-stop" aria-label="Zastaviť"><span class="stop-square"></span></button>
</div>

<!-- Pripomienka z kalendára – ťuknutie kamkoľvek ju potvrdí -->
<div id="reminder" class="overlay reminder hidden" aria-label="Pripomienka">
  <div class="huge">⏰</div>
  <div class="reminder-ok">👍</div>
</div>

<!-- Po hovore o pomoc: dovolal sa? -->
<div id="help-check" class="overlay help-check hidden">
  <button id="help-ok" class="half ok" aria-label="Áno, dovolal som sa"><span class="huge">✅</span></button>
  <button id="help-backup" class="half backup" aria-label="Zavolať záložný kontakt">
    <span class="huge">📞</span><span id="help-backup-photo" class="help-photo"></span>
  </button>
</div>

<div id="settings" class="settings hidden"></div>

<script src="app.js"></script>
</body>
</html>
